<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Megadoc Gold Annotator</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#07111f; color:#dce9f7 }
    * { box-sizing:border-box } body { margin:0; height:100vh; overflow:hidden }
    button,input,select,textarea { font:inherit; color:inherit; background:#0b1b2e; border:1px solid #29425c; border-radius:7px; padding:7px 9px }
    button { cursor:pointer } button:hover { background:#14304a } textarea { resize:vertical; width:100% }
    .app { display:grid; grid-template-columns:230px minmax(420px,1fr) 420px; height:100vh }
    aside,.editor { overflow:auto; border-right:1px solid #1d344a; background:#091624 }
    aside { padding:12px } .editor { border:0; border-left:1px solid #1d344a; padding:14px }
    .pdf { display:flex; flex-direction:column; min-width:0 } iframe { width:100%; flex:1; border:0; background:#313b47 }
    .toolbar { height:48px; display:flex; gap:8px; align-items:center; padding:7px 10px; border-bottom:1px solid #1d344a }
    .case { display:block; width:100%; text-align:left; margin:4px 0; padding:8px; font-size:12px }
    .case.active { border-color:#36c5d8; background:#12364a } .case.done::before { content:'✓ '; color:#56d69b }
    h2,h3 { margin:8px 0 } h3 { font-size:13px; color:#8fb5d8; text-transform:uppercase; letter-spacing:.06em }
    label { display:block; margin:8px 0 4px; color:#9db5cc; font-size:12px }
    input,select { width:100% } .row { display:grid; grid-template-columns:1fr 1fr; gap:8px }
    .unit { border:1px solid #29425c; border-radius:9px; padding:9px; margin:8px 0; background:#0a1929 }
    .unit-head { display:flex; justify-content:space-between; gap:8px }.unit-head button { width:auto; padding:3px 7px }
    .badge { border:1px solid #36516a; border-radius:999px; padding:4px 8px; font-size:11px }
    .progress { height:7px; background:#1a2a39; border-radius:9px; overflow:hidden; margin:8px 0 }.progress i { display:block; height:100%; background:#27b9ca }
    .status { font-size:11px; color:#7fd9a7 }.warn { color:#ffc16b }.tabs { display:flex; gap:6px; margin-bottom:10px }.tabs button { width:auto }
    .errors { border:1px solid #8f3b45; background:#35151d; color:#ffb1ba; border-radius:8px; padding:9px; margin:9px 0; font-size:12px }
    .hidden { display:none!important }.question { border-bottom:1px solid #22384d; padding:10px 0 }
    .actions { display:flex; gap:7px; margin:10px 0 }.actions button { flex:1 }.primary { background:#0e6977; border-color:#27b9ca }
    code { font-size:11px; color:#79bed1 }.small { font-size:11px; color:#7893aa }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <h2>Gold corpus</h2>
    <div id="progressText" class="small">Caricamento…</div><div class="progress"><i id="progressBar"></i></div>
    <input id="filter" placeholder="Filtra periodo/caso">
    <div id="caseList"></div>
  </aside>
  <main class="pdf">
    <div class="toolbar">
      <button id="prev">←</button><button id="next">→</button>
      <span id="caseTitle"></span><span id="pageBadge" class="badge"></span>
      <input id="page" type="number" min="1" style="width:78px">
      <button id="openPdf">Nuova scheda</button>
      <span id="saveStatus" class="status">Pronto</span>
    </div>
    <iframe id="pdfFrame" title="Documento PDF"></iframe>
  </main>
  <section class="editor">
    <div class="tabs"><button data-tab="document" class="primary">Documento</button><button data-tab="questions">Domande</button></div>
    <div id="documentTab">
      <label><input id="reviewed" type="checkbox" style="width:auto" disabled> Revisione documento completata</label>
      <label><input id="orientationVerified" type="checkbox" style="width:auto"> Orientamento suggerito verificato</label>
      <div id="orientationHint" class="small"></div>
      <div class="row"><div><label>Tipo principale</label><select id="documentType"></select></div><div><label>Qualità scan</label><select id="quality"><option>good</option><option>readable</option><option>low_quality</option><option>failed</option></select></div></div>
      <label>Titolo minimo</label><input id="title" placeholder="Titolo dichiarato o descrittivo">
      <h3>Entità chiave</h3><div id="entities"></div><button id="addEntity">+ Aggiungi entità</button>
      <h3>Document unit</h3><div id="units"></div><button id="addUnit">+ Aggiungi unità</button>
      <label>Note / anomalie / ordine pagine</label><textarea id="notes" rows="3"></textarea>
      <div id="validationErrors" class="errors hidden"></div>
      <div class="actions"><button id="save" class="primary">Salva Ctrl+S</button><button id="completeNext">Completa e avanti</button></div>
    </div>
    <div id="questionsTab" class="hidden">
      <p class="small">Aggiungi domande realistiche. Per le domande senza risposta lascia vuota la risposta e seleziona “non rispondibile”.</p>
      <div id="questions"></div><button id="addQuestion">+ Nuova domanda</button>
    </div>
  </section>
</div>
<script>
const TYPES=['altro','bolletta','fattura','rendiconto_contabile','riparto_spese','preventivo','verbale','lettera','contratto','estratto_conto','regolamento_condominiale'];
let state, current=0, page=1, saveTimer;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function init(){state=await fetch('/api/state').then(r=>r.json()); renderList(); openCase(0); renderProgress();}
function suggestedSpecialist(type){return ['bolletta','fattura'].includes(type)?'payable':['rendiconto_contabile','riparto_spese','preventivo'].includes(type)?'accounting':'none'}
function annotation(){const c=state.cases[current],id=c.case_id;const a=state.annotations.documents[id]??=( {reviewed:false,orientation_verified:false,document_type:'altro',quality:'readable',title:'',entities:[],document_units:[],notes:''} );a.entities=(a.entities||[]).map(e=>typeof e==='string'?{entity_type:'unknown',value:e}:e);if(!Array.isArray(a.document_units)||!a.document_units.length)a.document_units=[{start_page:1,end_page:c.pages,document_type:a.document_type||'altro',title:a.title||'',specialist:{kind:suggestedSpecialist(a.document_type)}}];a.document_units.forEach(u=>{u.specialist??={kind:suggestedSpecialist(u.document_type)}});if(a.specialist&&a.specialist.kind&&a.specialist.kind!=='none'&&a.document_units.length===1&&a.document_units[0].specialist.kind==='none')a.document_units[0].specialist={...a.specialist};delete a.specialist;return a;}
function renderList(){const q=$('filter').value.toLowerCase();$('caseList').innerHTML=state.cases.map((c,i)=>({c,i})).filter(x=>(x.c.case_id+' '+x.c.period).toLowerCase().includes(q)).map(({c,i})=>`<button class="case ${i===current?'active':''} ${state.annotations.documents[c.case_id]?.reviewed?'done':''}" onclick="openCase(${i})">${esc(c.case_id)}<br><span class="small">${c.pages} pagine · ${c.size_bucket}</span></button>`).join('');}
function openCase(i){current=Math.max(0,Math.min(state.cases.length-1,i));page=1;renderList();renderDocument();showPage();}
function showPage(){const c=state.cases[current]; page=Math.max(1,Math.min(c.pages,Number(page)||1));$('page').value=page;$('pageBadge').textContent=`p. ${page}/${c.pages}`;$('pdfFrame').src=`/api/pdf/${encodeURIComponent(c.case_id)}#page=${page}&zoom=page-fit`;}
function renderDocument(){const c=state.cases[current],a=annotation();$('caseTitle').textContent=c.case_id;$('reviewed').checked=!!a.reviewed;$('orientationVerified').checked=!!a.orientation_verified;$('documentType').innerHTML=TYPES.map(t=>`<option ${a.document_type===t?'selected':''}>${t}</option>`).join('');$('quality').value=a.quality||'readable';$('title').value=a.title||'';$('notes').value=a.notes||'';const hint=(state.orientation_suggestions.documents||[]).find(x=>x.case_id===c.case_id);$('orientationHint').textContent=hint?`Suggerimento: rotazione dominante ${hint.dominant_rotation??'mista'}°, pagine ${hint.pages.join(', ')}`:'Nessun suggerimento';renderEntities();renderUnits();showValidation(validateCurrent());}
function renderEntities(){const a=annotation();$('entities').innerHTML=(a.entities||[]).map((e,i)=>`<div class="unit row"><select onchange="entityField(${i},'entity_type',this.value)">${['unknown','persona','organizzazione','indirizzo','luogo','fornitore'].map(t=>`<option ${e.entity_type===t?'selected':''}>${t}</option>`).join('')}</select><div style="display:flex;gap:5px"><input value="${esc(e.value||'')}" onchange="entityField(${i},'value',this.value)"><button style="width:auto" onclick="removeEntity(${i})">×</button></div></div>`).join('');}
function entityField(i,k,v){annotation().entities[i][k]=v;queueSave()}function removeEntity(i){annotation().entities.splice(i,1);renderEntities();queueSave()}
function specialistHtml(s,i){const kind=s?.kind||'none';let fields='';if(kind==='payable')fields=`<div class="row"><div><label>Emittente</label><input value="${esc(s.issuer||'')}" onchange="specialField(${i},'issuer',this.value)"></div><div><label>Destinatario</label><input value="${esc(s.recipient||'')}" onchange="specialField(${i},'recipient',this.value)"></div></div><div class="row"><div><label>Importo</label><input value="${esc(s.amount||'')}" onchange="specialField(${i},'amount',this.value)"></div><div><label>Scadenza</label><input value="${esc(s.due_date||'')}" onchange="specialField(${i},'due_date',this.value)"></div></div><label>Oggetto</label><input value="${esc(s.subject||'')}" onchange="specialField(${i},'subject',this.value)"><label>Riferimento</label><input value="${esc(s.payment_reference||'')}" onchange="specialField(${i},'payment_reference',this.value)">`;if(kind==='accounting')fields=`<label>Pagine con tabelle</label><input value="${esc(s.table_pages||'')}" onchange="specialField(${i},'table_pages',this.value)"><label>Celle/totali campione</label><textarea rows="3" onchange="specialField(${i},'cell_checks',this.value)">${esc(s.cell_checks||'')}</textarea>`;return `<label>Specialista unità</label><select onchange="specialKind(${i},this.value)"><option value="none" ${kind==='none'?'selected':''}>Nessuno</option><option value="payable" ${kind==='payable'?'selected':''}>Payable</option><option value="accounting" ${kind==='accounting'?'selected':''}>Accounting</option><option value="other" ${kind==='other'?'selected':''}>Altro</option></select>${fields}`}
function renderUnits(){const a=annotation();$('units').innerHTML=(a.document_units||[]).map((u,i)=>`<div class="unit"><div class="unit-head"><b>Unità ${i+1}</b><button onclick="removeUnit(${i})">×</button></div><div class="row"><div><label>Da pagina</label><input type="number" value="${u.start_page||1}" onchange="unitField(${i},'start_page',this.value)"></div><div><label>A pagina</label><input type="number" value="${u.end_page||1}" onchange="unitField(${i},'end_page',this.value)"></div></div><label>Tipo</label><select onchange="unitType(${i},this.value)">${TYPES.map(t=>`<option ${u.document_type===t?'selected':''}>${t}</option>`).join('')}</select><label>Titolo</label><input value="${esc(u.title||'')}" onchange="unitField(${i},'title',this.value)">${specialistHtml(u.specialist,i)}</div>`).join('');}
function unitField(i,k,v){annotation().document_units[i][k]=k.endsWith('page')?Number(v):v;queueSave();}function unitType(i,v){const u=annotation().document_units[i];u.document_type=v;if(!u.specialist||u.specialist.kind==='none')u.specialist={kind:suggestedSpecialist(v)};renderUnits();queueSave()}function specialKind(i,v){annotation().document_units[i].specialist={kind:v};renderUnits();queueSave()}function specialField(i,k,v){annotation().document_units[i].specialist[k]=v;queueSave()}function removeUnit(i){annotation().document_units.splice(i,1);renderUnits();queueSave();}
function renderQuestions(){const qs=state.annotations.questions||=[];$('questions').innerHTML=qs.map((q,i)=>`<div class="question"><label>Domanda</label><textarea rows="2" onchange="questionField(${i},'question',this.value)">${esc(q.question||'')}</textarea><label><input type="checkbox" style="width:auto" ${q.answerable!==false?'checked':''} onchange="questionField(${i},'answerable',this.checked)"> Rispondibile</label><label>Risposta attesa</label><textarea rows="2" onchange="questionField(${i},'expected_answer',this.value)">${esc(q.expected_answer||'')}</textarea><label>Evidenza: case_id:pagine</label><input value="${esc(q.evidence||'')}" onchange="questionField(${i},'evidence',this.value)" placeholder="pisa-2011-large:2-3"><button onclick="removeQuestion(${i})">Elimina</button></div>`).join('');}
function questionField(i,k,v){state.annotations.questions[i][k]=v;queueSave();}function removeQuestion(i){state.annotations.questions.splice(i,1);renderQuestions();queueSave();}
function collect(){const a=annotation();a.reviewed=$('reviewed').checked;a.orientation_verified=$('orientationVerified').checked;a.document_type=$('documentType').value;a.quality=$('quality').value;a.title=$('title').value;a.notes=$('notes').value;}
function validateCurrent(){collect();const a=annotation(),c=state.cases[current],errors=[];if(!a.orientation_verified)errors.push('Verifica l’orientamento');if(!a.title.trim())errors.push('Inserisci il titolo del documento');if(!a.document_units.length)errors.push('Aggiungi almeno una document unit');const covered=[];a.document_units.forEach((u,i)=>{if(!u.title?.trim())errors.push(`Unità ${i+1}: titolo mancante`);if(!u.document_type)errors.push(`Unità ${i+1}: tipo mancante`);if(!Number.isInteger(u.start_page)||!Number.isInteger(u.end_page)||u.start_page<1||u.end_page<u.start_page||u.end_page>c.pages)errors.push(`Unità ${i+1}: intervallo pagine non valido`);else for(let p=u.start_page;p<=u.end_page;p++)covered.push(p);const s=u.specialist||{kind:'none'};if(s.kind==='payable'&&(!s.issuer?.trim()||!s.amount?.trim()||!s.due_date?.trim()))errors.push(`Unità ${i+1}: payable richiede emittente, importo e scadenza`);if(s.kind==='accounting'&&(!s.table_pages?.trim()||!s.cell_checks?.trim()))errors.push(`Unità ${i+1}: accounting richiede pagine tabelle e celle campione`)});if(covered.sort((x,y)=>x-y).join(',')!==Array.from({length:c.pages},(_,i)=>i+1).join(','))errors.push('Le unità devono coprire ogni pagina esattamente una volta');a.entities.forEach((e,i)=>{if(!e.value?.trim()||e.entity_type==='unknown')errors.push(`Entità ${i+1}: scegli tipo e valore`)});return [...new Set(errors)]}
function showValidation(errors){$('validationErrors').classList.toggle('hidden',!errors.length);$('validationErrors').innerHTML=errors.length?`<b>Impossibile completare:</b><ul>${errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}
function queueSave(){clearTimeout(saveTimer);$('saveStatus').textContent='Modifiche…';saveTimer=setTimeout(save,500)}
async function save(){collect();$('saveStatus').textContent='Salvataggio…';const r=await fetch('/api/annotations',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(state.annotations)}).then(r=>r.json());$('saveStatus').textContent=r.saved?'Salvato':'Errore';if(r.progress){state.progress=r.progress;renderProgress()}renderList();}
function renderProgress(){const p=state.progress||{};$('progressText').textContent=`${p.documents_reviewed||0}/${p.documents_total||state.cases.length} documenti · ${p.questions||0}/30 domande`;$('progressBar').style.width=`${100*(p.documents_reviewed||0)/(p.documents_total||state.cases.length)}%`;}
document.addEventListener('input',e=>{if(e.target.closest('#documentTab')&&!e.target.closest('#units'))queueSave()});$('filter').oninput=renderList;$('prev').onclick=()=>openCase(current-1);$('next').onclick=()=>openCase(current+1);$('page').onchange=()=>{page=$('page').value;showPage()};$('openPdf').onclick=()=>window.open(`/api/pdf/${encodeURIComponent(state.cases[current].case_id)}#page=${page}`,'_blank');$('addEntity').onclick=()=>{annotation().entities.push({entity_type:'unknown',value:''});renderEntities();queueSave()};$('addUnit').onclick=()=>{const a=annotation();const last=a.document_units.at(-1);const start=last?last.end_page+1:1;a.document_units.push({start_page:start,end_page:start,document_type:a.document_type||'altro',title:'',specialist:{kind:suggestedSpecialist(a.document_type)}});renderUnits();queueSave()};$('save').onclick=save;$('completeNext').onclick=async()=>{const errors=validateCurrent();showValidation(errors);if(errors.length){$('reviewed').checked=false;await save();return}$('reviewed').checked=true;await save();openCase(current+1)};$('addQuestion').onclick=()=>{(state.annotations.questions??=[]).push({question:'',answerable:true,expected_answer:'',evidence:''});renderQuestions();queueSave()};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const q=b.dataset.tab==='questions';$('documentTab').classList.toggle('hidden',q);$('questionsTab').classList.toggle('hidden',!q);document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('primary',x===b));if(q)renderQuestions()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}if(!e.target.matches('input,textarea,select')){if(e.key==='ArrowRight')openCase(current+1);if(e.key==='ArrowLeft')openCase(current-1)}});init();
</script>
</body>
</html>
